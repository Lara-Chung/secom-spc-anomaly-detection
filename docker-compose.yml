services:
  db:
    image: postgres:16.14
    container_name: secom-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secom}
      POSTGRES_DB: ${POSTGRES_DB:-secom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted read-only so SQL files can be run with psql inside the container
      - ./sql:/sql:ro
    healthcheck:
      # TCP check: the image's init-phase server only listens on the Unix socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

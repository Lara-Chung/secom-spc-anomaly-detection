[project]
name = "secom-spc-anomaly-detection"
version = "0.1.0"
description = "SQL-based SPC monitoring and anomaly detection on the UCI SECOM semiconductor dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas>=2.1",
    "scikit-learn",
    "psycopg[binary]",
    "matplotlib",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "altair>=6.3.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
